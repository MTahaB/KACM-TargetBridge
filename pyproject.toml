[build-system]
requires = ["setuptools==82.0.1", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kacm-targetbridge"
version = "0.2.0"
description = "Uncertainty-aware molecular activity prediction from ChEMBL data."
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [{ name = "KACM-TargetBridge contributors" }]
dependencies = [
  "numpy==2.4.6",
  "pandas==3.0.3",
  "scikit-learn==1.8.0",
  "scipy==1.17.1",
  "joblib==1.5.3",
  "xgboost==3.2.0",
  "lightgbm==4.6.0",
  "tqdm==4.67.3",
  "click==8.4.1",
  "rdkit==2026.3.2",
  "requests==2.34.2",
  "streamlit==1.58.0",
  "matplotlib==3.10.9",
  "seaborn==0.13.2",
  "plotly==6.7.0",
  "py3Dmol==2.5.5",
  "optuna==4.9.0",
  "hyperopt==0.2.7",
]

[project.optional-dependencies]
dev = [
  "black==26.5.1",
  "flake8==7.3.0",
  "pytest==9.0.3",
  "mypy==1.18.2",
  "nbformat==5.10.4",
  "pip-tools==7.5.2",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
no_site_packages = true
implicit_optional = true
warn_unused_configs = true
packages = ["src"]
disable_error_code = [
  "assignment",
  "index",
  "operator",
  "union-attr",
  "var-annotated",
]
